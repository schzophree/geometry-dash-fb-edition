<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DASHCUBE: Fesnuk Edition</title>
  <link rel="icon" type="image/x-icon" href="assets/images/icons/icon.ico">
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #gameCanvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
  <script type="module" src="js/main.js"></script>
  <!-- GD DevTools/Level Editor (Hanya untuk keperluan developer) -->
  <script src="js/devtools.js"></script>
</head>
<body>
  <main id="gameWrap" class="game-wrap" aria-label="Geometry Dash Fesnuk Edition">
    <canvas id="gameCanvas" width="800" height="450" aria-label="Geometry Dash Fesnuk game canvas"></canvas>

    <!-- GD-Style Loading Screen -->
    <div id="loader" class="gd-loader">
      <img class="loader-logo" src="assets/ui/loading_logo.png" alt="Geometry Dash Logo"
           onerror="this.style.display='none'">
      <img class="loader-subtitle" src="assets/ui/fesnuk_edition.png" alt="Fesnuk Edition"
           style="width: min(350px, 70vw); margin: -10px auto 30px; display: block;"
           onerror="this.style.display='none'">
      <div class="loader-spinner"></div>
      <div class="loader-progress">
        <div class="css-loader-bar">
          <div id="loadingFill" class="css-loader-fill"></div>
        </div>
        <div id="loadingText" class="loader-status">MEMUAT ASSETS...</div>
      </div>
    </div>

    <section id="startOverlay" class="screen start-screen" aria-label="Menu utama">
      <div class="screen-shade"></div>
      <div class="start-content">
        <img id="logoImage" class="logo-image" alt="Geometry Dash Fesnuk logo" hidden />
        <h1 id="logoText" class="game-logo">DASHCUBE</h1>
        <img class="game-subtitle-img" src="assets/ui/fesnuk_edition.png" alt="Fesnuk Edition" style="width: min(300px, 60vw); margin: -5px auto 20px; display: block;" onerror="this.style.display='none'">


        <div id="levelButtons" class="level-buttons" aria-label="Pilih tingkat awal">
          <button type="button" data-level="0" class="level-choice is-active">EASY</button>
          <button type="button" data-level="1" class="level-choice">NORMAL</button>
          <button type="button" data-level="2" class="level-choice">BOSS</button>
        </div>

        <button id="startButton" type="button" class="start-button" aria-label="Mulai game">
          <span class="play-triangle" aria-hidden="true"></span>
          <span>MULAI</span>
        </button>

        <p class="start-blink">SPASI / TAP UNTUK MAIN</p>
        <p class="start-hint">TAHAN untuk lompat terus · ENTER = mulai</p>
      </div>
    </section>

    <section id="pauseOverlay" class="screen pause-screen" aria-label="Game dijeda">
      <div class="pause-card">
        <h2><span aria-hidden="true">⏸</span> DIJEDA</h2>
        <div class="pause-line"></div>
        <p id="pauseScore">Score: 0</p>
        <p id="pauseSong">Song: Synth Beat</p>
        <button id="resumeButton" type="button" class="pause-action primary">▶ LANJUTKAN</button>
        <button id="pauseRestartButton" type="button" class="pause-action">↻ MAIN LAGI</button>
        <button id="menuButton" type="button" class="pause-action">⌂ MENU UTAMA</button>
        <button id="muteButton" type="button" class="pause-action">🔊 MUTE</button>
      </div>
    </section>

    <section id="deadOverlay" class="screen dead-screen" aria-label="Game over">
      <div class="dead-card">
        <h2>GAME OVER</h2>
        <div id="deadReason" class="dead-reason-box"></div>
        <p id="deadScore">Score: 0</p>
        <button id="continueCheckpointButton" type="button" class="dead-action checkpoint">▶ LANJUT DARI CHECKPOINT</button>
        <button id="restartButton" type="button" class="dead-action">↻ MULAI DARI AWAL</button>
      </div>
    </section>

    <div id="checkpointFlash" class="checkpoint-flash" aria-live="polite">CHECKPOINT!</div>
  </main>
</body>
</html>
